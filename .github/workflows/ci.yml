# No game data is ever available here. Everything runs on the repository alone.
name: ci

on:
  push:
  pull_request:

jobs:
  build:
    name: build (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install optional instruction-trace dependency
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.9
      - name: Install isolated generator dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap apparmor
      - name: Configure the bubblewrap namespace permission on the CI runner
        # Ubuntu restricts user namespaces unless the sandbox executable has an application profile.
        # Configure only that launcher; keep AppArmor and global namespace restrictions enabled.
        run: |
          for profile in /etc/apparmor.d/bwrap /etc/apparmor.d/bwrap-userns-restrict; do
            if [ -f "$profile" ]; then
              sudo apparmor_parser -r "$profile"
              exit 0
            fi
          done
          # Minimal Ubuntu application policy, scoped to the sandbox launcher on this
          # disposable runner. No global sysctl changes or workstation installation.
          sudo tee /etc/apparmor.d/paleblood-generator-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile paleblood-generator-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/paleblood-generator-bwrap
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build -j
      - name: RT_SYSLIB unit tests (every push and pull request)
        run: ctest --test-dir build --output-on-failure --no-tests=error -R '^syslib$'
      - name: Remaining CTest suite
        run: ctest --test-dir build --output-on-failure --no-tests=error -E '^syslib$'
      - name: Differential harness and instruction-trace tests
        env:
          CC: ${{ matrix.cc }}
          BB_LOADER: build/runtime/libpbloader.so
        run: python3 -m unittest discover -s test -p 'test_harness.py'
      - name: Differential engine tests
        env:
          CC: ${{ matrix.cc }}
          BB_LOADER: build/runtime/libpbloader.so
        run: python3 -m unittest discover -s test -p 'test_differential.py'
      - name: Opt-in generator regression tests (no model calls)
        env:
          CC: ${{ matrix.cc }}
          BB_LOADER: build/runtime/libpbloader.so
          BB_REQUIRE_GENERATOR_SANDBOX: '1'
        run: python3 -m unittest discover -s test -p 'test_implementation_generator.py' -v

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject game data
        run: python3 tools/check_no_game_data.py --tracked
      - name: Validate functions.csv, ghidra_functions.csv, hooks.csv
        run: python3 tools/validate_functions.py
      - name: Game-agnostic runtime
        run: python3 tools/check_agnostic.py
      - name: Readable game code (STYLE.md); the allowlist only shrinks
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}"
            base=FETCH_HEAD
          else
            base="${{ github.event.before }}"
            git fetch --depth=1 origin "$base" 2>/dev/null || base=
          fi
          python3 tools/check_readable.py ${base:+--base "$base"}
      - name: README progress matches progress.py
        run: python3 tools/progress.py --check
      - name: Hooks behave
        run: tools/test_hooks.sh
      - name: Contributor tooling (session report, handoff)
        working-directory: test
        run: python3 -m unittest test_handoff test_runtime_pr test_tools.SessionReport

  session-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate report and runtime-only path from changed files
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 tools/runtime_pr.py --check-pull-request \
            --base "$BASE_SHA" --head "$HEAD_SHA" --body "$RUNNER_TEMP/pr-body.md"
