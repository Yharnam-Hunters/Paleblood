name: macos-guest-tls

on:
  push:
    # main only: a pull request's branch is checked by its pull_request run. No merge_group run:
    # this workflow's checks are not required, and merge_group ignores the path filters, so it
    # would run for every queued pull request.
    branches: [main]
    paths:
      - '.github/workflows/macos-guest-tls.yml'
      - 'CMakeLists.txt'
      - 'cmake/DarwinGuestTLS.cmake'
      - 'runtime/guest_tls_darwin.c'
      - 'runtime/include/runtime/guest_tls.h'
      - 'test/test_guest_tls_darwin.c'
      - 'test/test_guest_tls_failures.c'
      - 'cmake/DarwinGuestPointer.cmake'
      - 'cmake/DarwinGameGuestPointerTests.cmake'
      - 'runtime/guest_pointer_darwin.c'
      - 'runtime/plugin.c'
      - 'runtime/include/runtime/guest_pointer.h'
      - 'runtime/include/runtime/game_guest_pointer.h'
      - 'test/game_guest_pointer_module.c'
      - 'test/test_game_guest_pointer.c'
      - 'test/test_game_guest_pointer_control.py'
      - 'game/engine/temporary_heap.h'
      - 'game/engine/temporary_heap_create.cpp'
      - 'game/engine/temporary_heap_operations.cpp'
      - 'game/engine/fixed_allocator.h'
      - 'game/engine/linear_heap.h'
      - 'game/engine/thread.h'
      - 'game/engine/engine.h'
      - 'runtime/include/runtime/original.h'
      - 'game/engine/tests/temporary_operations_guest_tls.cpp'
      - 'game/engine/tests/temporary_operations_guest_tls_control.py'
  pull_request:
    paths:
      - '.github/workflows/macos-guest-tls.yml'
      - 'CMakeLists.txt'
      - 'cmake/DarwinGuestTLS.cmake'
      - 'runtime/guest_tls_darwin.c'
      - 'runtime/include/runtime/guest_tls.h'
      - 'test/test_guest_tls_darwin.c'
      - 'test/test_guest_tls_failures.c'
      - 'cmake/DarwinGuestPointer.cmake'
      - 'cmake/DarwinGameGuestPointerTests.cmake'
      - 'runtime/guest_pointer_darwin.c'
      - 'runtime/plugin.c'
      - 'runtime/include/runtime/guest_pointer.h'
      - 'runtime/include/runtime/game_guest_pointer.h'
      - 'test/game_guest_pointer_module.c'
      - 'test/test_game_guest_pointer.c'
      - 'test/test_game_guest_pointer_control.py'
      - 'game/engine/temporary_heap.h'
      - 'game/engine/temporary_heap_create.cpp'
      - 'game/engine/temporary_heap_operations.cpp'
      - 'game/engine/fixed_allocator.h'
      - 'game/engine/linear_heap.h'
      - 'game/engine/thread.h'
      - 'game/engine/engine.h'
      - 'runtime/include/runtime/original.h'
      - 'game/engine/tests/temporary_operations_guest_tls.cpp'
      - 'game/engine/tests/temporary_operations_guest_tls_control.py'

permissions:
  contents: read

jobs:
  owned-tls:
    name: Owned guest TLS (Darwin x86-64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Configure normal root build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
      - name: Build owned library and tests from root
        run: cmake --build build --target guest_tls_owned test_guest_tls_darwin test_guest_tls_failures test_game_guest_pointer_correct test_game_guest_pointer_wrong test_game_guest_pointer test_game_guest_pointer_absent test_temporary_operations_guest_tls_correct test_temporary_operations_guest_tls_wrong --parallel 2
      - name: Qualify owned GS/TSD profile and failure handling
        run: ctest --test-dir build -R '^(darwin_guest_tls_(owned|failures)|darwin_game_guest_pointer(_absent|_wrong_slot)?|darwin_temporary_operations_guest_tls(_wrong_getter)?)$' --output-on-failure --no-tests=error
