# The README's decompilation progress map and badges, and the progress page, published on GitHub Pages.
#
# They are not committed: this workflow builds them with tools/progress_map.py and
# tools/progress_page.py from the committed tables under symbols/ (no game data, no secrets) on
# every push to main and deploys them to https://yharnam-hunters.github.io/Paleblood/
# (progress.svg, badge-*.svg, progress.html, progress.json), which the README embeds and links,
# so they are never behind main. The page's "open pull requests" section reads the function
# tables at each open pull request's head with the read-only token (data only, never run); if
# that fails, the page is built without it and says so. The schedule and manual runs are a backstop. A failed
# generation fails the run; nothing is deployed then and the last good map stays up.
name: progress-map

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: progress-map
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read the open pull requests' function tables (data only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/progress_page.py --fetch-open-prs "$RUNNER_TEMP/open-prs.json" --repo "$GITHUB_REPOSITORY" \
            || { echo "progress-page: open pull requests not read; the page goes without them" >&2; rm -f "$RUNNER_TEMP/open-prs.json"; }
      - name: Build the map, badges and progress page from symbols/
        run: |
          set -euo pipefail
          python3 tools/progress_map.py --out-dir "$RUNNER_TEMP/site"
          open_prs=()
          if [ -s "$RUNNER_TEMP/open-prs.json" ]; then open_prs=(--open-prs "$RUNNER_TEMP/open-prs.json"); fi
          python3 tools/progress_page.py --out-dir "$RUNNER_TEMP/site" "${open_prs[@]}" --source-sha "$GITHUB_SHA" \
            --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --wiki-url "https://yharnam-hunters.github.io/byrgenwerth-site/"
          for f in progress.svg badge-verified.svg badge-replaced.svg badge-code.svg badge-week.svg progress.html progress.json; do
            test -s "$RUNNER_TEMP/site/$f" || { echo "progress-map: $f was not generated" >&2; exit 1; }
          done
          {
            echo '### Progress map'
            echo
            echo "Built from main ${GITHUB_SHA::12}:"
            python3 tools/progress.py --status-line
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
